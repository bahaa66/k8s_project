apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  labels:
    app: my-app
spec:
  containers:
  - name: my-container
    image: nginx:latest
    ports:
    - containerPort: 80

  - name: alpine-container
    image: alpine:latest
    command: ["sh", "-c", "echo Hello from Alpine! && sleep 3600"]
    
    
    